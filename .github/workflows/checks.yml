name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python test tools
        run: python -m pip install Pillow ruff
      - name: Lint
        run: ruff check .
      - name: Icon tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build and test Windows
        shell: pwsh
        run: .\build.ps1 -Test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build both architectures and run native tests
        run: bash build-macos.sh --test
