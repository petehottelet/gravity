<svg xmlns="http://www.w3.org/2000/svg" width="158" height="20" viewBox="0 0 158 20" role="img" aria-label="Mac: Apple Silicon + Intel">
  <title>Mac: Apple Silicon + Intel</title>
  <linearGradient id="shade" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="rounded"><rect width="158" height="20" rx="3"/></clipPath>
  <g clip-path="url(#rounded)">
    <rect width="32" height="20" fill="#555"/>
    <rect x="32" width="126" height="20" fill="#555555"/>
    <rect width="158" height="20" fill="url(#shade)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
    <text x="16" y="14">Mac</text>
    <text x="95" y="14">Apple Silicon + Intel</text>
  </g>
</svg>
