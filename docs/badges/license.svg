<svg xmlns="http://www.w3.org/2000/svg" width="80" height="20" viewBox="0 0 80 20" role="img" aria-label="license: MIT">
  <title>license: MIT</title>
  <linearGradient id="shade" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="rounded"><rect width="80" height="20" rx="3"/></clipPath>
  <g clip-path="url(#rounded)">
    <rect width="49" height="20" fill="#555"/>
    <rect x="49" width="31" height="20" fill="#2ea44f"/>
    <rect width="80" height="20" fill="url(#shade)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">
    <text x="24.5" y="14">license</text>
    <text x="64.5" y="14">MIT</text>
  </g>
</svg>
